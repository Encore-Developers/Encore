name: Indev - Windows x64, Linux, macOS
on:
  workflow_dispatch:
  pull_request:
    branches: ['main', 'indev']
  push:
    branches: ['main', 'indev']

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Configure CMake x64
      run: cmake -B ${{github.workspace}}/build_x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build x64
      run: cmake --build ${{github.workspace}}/build_x64 --config ${{env.BUILD_TYPE}}

    - name: Move Assets/Songs folders and bass.dll x64
      working-directory: ${{github.workspace}}/build_x64/Encore
      run: move Assets Release/Assets ; move Songs Release/Songs ; move bass.dll Release/bass.dll ; move bassopus.dll Release/bassopus.dll ; move discord_game_sdk.dll Release/discord_game_sdk.dll ; move avformat-62.dll Release/avformat-62.dll ; move avcodec-62.dll Release/avcodec-62.dll
         ; move avutil-60.dll Release/avutil-60.dll ; move swscale-9.dll Release/swscale-9.dll ; move swresample-6.dll Release/swresample-6.dll
        
    - uses: actions/upload-artifact@v4
      with:
        name: Encore_Win_x64-Indev
        path: ${{github.workspace}}/build_x64/Encore/Release/*


  build-linux:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Perform forbidden action
      run: echo "deb http://us.archive.ubuntu.com/ubuntu stonking main restricted universe multiverse" >> /etc/apt/sources.list
    
    - name: Update apt-get
      run: sudo apt-get update
      
    - name: Install Dependencies
      run: sudo apt-get install libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxtst-dev libavcodec-dev libswscale-dev libavformat-dev
      
    - name: Configure CMake x64
      run: cmake -B ${{github.workspace}}/build_linux_x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build x64
      run: cmake --build ${{github.workspace}}/build_linux_x64 --config ${{env.BUILD_TYPE}}

    - name: Remove CMake files x64
      working-directory: ${{github.workspace}}/build_linux_x64/Encore
      run: rm -r -f CMakeFiles Makefile cmake_install.cmake
      
    - uses: actions/upload-artifact@v4
      with:
        name: Encore_Linux_x64-Indev
        path: ${{github.workspace}}/build_linux_x64/Encore/*

        
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install ffmpeg
      run: brew install -y ffmpeg

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build_macos -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build_macos --config ${{env.BUILD_TYPE}}

    - name: Remove CMake files
      working-directory: ${{github.workspace}}/build_macos/Encore
      run: rm -r -f CMakeFiles Makefile cmake_install.cmake
    
    - name: Create .app Bundle
      working-directory: ${{github.workspace}}
      run: ./create-macos-app.sh
    
    - name: Create Disk Image
      working-directory: ${{github.workspace}}
      run: hdiutil create -volname Encore -srcfolder out -ov -format UDZO Encore.dmg
    
    - uses: actions/upload-artifact@v4
      with:
        name: Encore_macOS-Indev
        path: ${{github.workspace}}/Encore.dmg

